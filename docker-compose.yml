services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: watchdog
      POSTGRES_PASSWORD: watchdog
      POSTGRES_DB: retail
    ports:
      # 15432 rather than 5432, so it never clashes with a PostgreSQL already installed on your laptop.
      # (The kit's scripts create the tables from schema.sql themselves, so nothing is mounted from your disk.)
      - "${PG_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U watchdog -d retail"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
